name: Android CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # Never cancel a release build half-way.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Empty unless the repository defines the signing secrets (see README).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # gradle.properties sets android.builder.sdkDownload=false, so the SDK packages must already be present.
      # The runner image ships both; this is a fast no-op that keeps the build working if the image drops them.
      - name: Android SDK packages
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$name" || { echo "::error::versionName not found in app/build.gradle.kts"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name (expected v$name)"
            exit 1
          fi

      - name: Configure release signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Signing notice
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::No signing secrets configured - the release APK is signed with a throwaway debug key and cannot update an existing install."

      - name: Unit tests and lint
        run: ./gradlew test lintDebug

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PicACGMD-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PicACGMD-v${{ steps.version.outputs.name }}-debug.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: PicACGMD-v${{ steps.version.outputs.name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PicACGMD-v${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/PicACGMD-v${{ needs.build.outputs.version }}.apk" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
